# Deploy ctetris WASM build len GitHub Pages khi co thay doi tai:
#   - app/src/**       (logic game C++)
#   - app/main.cpp     (entry tich hop)
#   - app/web/**       (HTML shell, manifest, service worker)
#   - app/CMakeLists.txt
#   - app/build.sh
#   - .github/workflows/deploy-pages.yml (chinh workflow nay)
name: Deploy WASM to GitHub Pages

on:
  push:
    branches: [main] [phucpt/github-pages]
    paths:
      - 'app/src/**'
      - 'app/main.cpp'
      - 'app/web/**'
      - 'app/CMakeLists.txt'
      - 'app/build.sh'
      - 'app/icons/template.svg'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:  # cho phep trigger thu cong tu UI

# Quyen toi thieu de deploy len Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chi cho 1 lan deploy chay tai mot thoi diem (huy run cu khi push moi)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai dat dependencies he thong
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              cmake ninja-build git curl \
              librsvg2-bin imagemagick

      # Cache emsdk de khong phai download lai moi run
      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-3.1.72-${{ runner.os }}

      - name: Cai dat emsdk (chi khi cache miss)
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install  3.1.72
          ./emsdk activate 3.1.72

      # Cache SDL3 source (FetchContent download ~10MB) + icons
      - name: Cache build deps
        uses: actions/cache@v4
        with:
          path: |
            app/build/wasm/ubuntu/_deps
            app/build/wasm/ubuntu/icons
          key: build-deps-${{ runner.os }}-${{ hashFiles('app/CMakeLists.txt', 'app/icons/template.svg', 'app/src/gameStory/gameStory_logo.svg') }}

      - name: Build WASM target ctetris
        env:
          # build.sh detect bien CI/GITHUB_ACTIONS de bo qua mode interactive
          CI: 'true'
          TARGET: 'ctetris'
          PLAT_CHOICE: '2'
        run: |
          # Source emsdk vao subshell hien tai cua step
          source ~/emsdk/emsdk_env.sh
          cd app
          bash build.sh

      - name: Chuan bi artifact (sao chep file can serve)
        run: |
          mkdir -p _site
          # Copy moi file output WASM (HTML/JS/WASM/manifest/sw/icons)
          cp -r app/build/wasm/ubuntu/. _site/
          # GitHub Pages can index.html o root -> tao redirect ngan
          if [ ! -f _site/index.html ]; then
              cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=ctetris.html">
              <title>cTetris</title>
          </head><body>
              <p>Redirect den <a href="ctetris.html">cTetris</a>...</p>
          </body></html>
          EOF
          fi
          ls -la _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy len GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4